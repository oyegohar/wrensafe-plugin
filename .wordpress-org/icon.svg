<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="ws-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2875"/>
      <stop offset="0.55" stop-color="#3349f0"/>
      <stop offset="1" stop-color="#6d4bff"/>
    </linearGradient>
    <radialGradient id="ws-glow" cx="0.72" cy="0.78" r="0.7">
      <stop offset="0" stop-color="#8f84ff" stop-opacity="0.55"/>
